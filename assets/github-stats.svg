<svg xmlns="http://www.w3.org/2000/svg" width="352" height="172" viewBox="0 0 352 172" role="img" aria-labelledby="title desc">
  <title id="title">John Andrew GitHub stats</title>
  <desc id="desc">A stable GitHub profile card summarizing active repositories, live demos, and core build focus.</desc>
  <defs>
    <linearGradient id="accent" x1="18" y1="20" x2="334" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.55" stop-color="#2EA043"/>
      <stop offset="1" stop-color="#F78166"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#010409" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="350" height="170" rx="14" fill="#0D1117" stroke="#30363D"/>
  <rect x="16" y="16" width="320" height="140" rx="12" fill="#111822" filter="url(#soft-shadow)"/>
  <rect x="16" y="16" width="320" height="4" rx="2" fill="url(#accent)"/>

  <text x="28" y="42" fill="#C9D1D9" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">GitHub Stats</text>
  <text x="28" y="61" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="11">andyombogo • health analytics and reporting tools</text>

  <g transform="translate(28 78)">
    <rect width="88" height="48" rx="9" fill="#0D1117" stroke="#263140"/>
    <text x="12" y="19" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">Active repos</text>
    <text x="12" y="39" fill="#58A6FF" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">10</text>
  </g>

  <g transform="translate(132 78)">
    <rect width="88" height="48" rx="9" fill="#0D1117" stroke="#263140"/>
    <text x="12" y="19" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">Live demos</text>
    <text x="12" y="39" fill="#3FB950" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">3</text>
  </g>

  <g transform="translate(236 78)">
    <rect width="88" height="48" rx="9" fill="#0D1117" stroke="#263140"/>
    <text x="12" y="19" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">Core stack</text>
    <text x="12" y="39" fill="#F78166" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Python</text>
  </g>

  <text x="28" y="145" fill="#C9D1D9" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Explainable ML • Dashboards • Public-health data products</text>
</svg>
